<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCrédito - Caja Municipal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-100 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [solicitudes, setSolicitudes] = React.useState([]);
            const [formData, setFormData] = React.useState({
                nombre_cliente: '',
                dni: '',
                ingresos_mensuales: '',
                monto_solicitado: '',
                motivo_prestamo: ''
            });
            const [cargando, setCargando] = React.useState(false);

            const cargarSolicitudes = async () => {
                try {
                    const res = await fetch('http://127.0.0.1:8000/solicitudes');
                    const data = await res.json();
                    setSolicitudes(data);
                } catch (err) {
                    console.error("Error al cargar solicitudes:", err);
                }
            };

            React.useEffect(() => {
                cargarSolicitudes();
            }, []);

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setCargando(true);
                try {
                    const res = await fetch('http://127.0.0.1:8000/evaluar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            nombre_cliente: formData.nombre_cliente,
                            dni: formData.dni,
                            ingresos_mensuales: parseFloat(formData.ingresos_mensuales),
                            monto_solicitado: parseFloat(formData.monto_solicitado),
                            motivo_prestamo: formData.motivo_prestamo
                        })
                    });
                    if (res.ok) {
                        setFormData({ nombre_cliente: '', dni: '', ingresos_mensuales: '', monto_solicitado: '', motivo_prestamo: '' });
                        cargarSolicitudes();
                    }
                } catch (err) {
                    alert("Error evaluando crédito");
                } finally {
                    setCargando(false);
                }
            };

            return (
                <div className="min-h-screen p-6 max-w-6xl mx-auto">
                    <header className="mb-8 flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900">SmartCrédito IA</h1>
                            <p className="text-slate-500 text-sm">Sistema de Evaluación Automática de Microcréditos para Cajas</p>
                        </div>
                        <span className="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full">Base de Datos: Supabase Conectada</span>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
                            <h2 className="text-lg font-semibold mb-4 text-slate-800">Nueva Solicitud</h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Nombre Completo</label>
                                    <input required type="text" name="nombre_cliente" value={formData.nombre_cliente} onChange={handleChange} className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej. Maria Gomez" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">DNI</label>
                                    <input required type="text" name="dni" value={formData.dni} onChange={handleChange} className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="8 dígitos" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Ingresos Mensuales (S/.)</label>
                                    <input required type="number" name="ingresos_mensuales" value={formData.ingresos_mensuales} onChange={handleChange} className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="2500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Monto Solicitado (S/.)</label>
                                    <input required type="number" name="monto_solicitado" value={formData.monto_solicitado} onChange={handleChange} className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="6000" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Motivo del Préstamo</label>
                                    <input required type="text" name="motivo_prestamo" value={formData.motivo_prestamo} onChange={handleChange} className="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Mercadería, equipamiento..." />
                                </div>
                                <button type="submit" disabled={cargando} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition text-sm">
                                    {cargando ? 'Evaluando...' : 'Evaluar e Inscribir Crédito'}
                                </button>
                            </form>
                        </div>

                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2">
                            <h2 className="text-lg font-semibold mb-4 text-slate-800">Solicitudes Evaluadas en Tiempo Real</h2>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs text-slate-600 border-collapse">
                                    <thead className="bg-slate-50 text-slate-700 uppercase font-semibold">
                                        <tr>
                                            <th className="p-3 border-b">Cliente / DNI</th>
                                            <th className="p-3 border-b">Ingreso / Monto</th>
                                            <th className="p-3 border-b">Estado</th>
                                            <th className="p-3 border-b">Dictamen de Evaluación</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {solicitudes.length === 0 ? (
                                            <tr>
                                                <td colSpan="4" className="p-4 text-center text-slate-400">No hay registros cargados aún.</td>
                                            </tr>
                                        ) : (
                                            solicitudes.map((s) => (
                                                <tr key={s.id} className="hover:bg-slate-50">
                                                    <td className="p-3">
                                                        <div className="font-medium text-slate-900">{s.nombre_cliente}</div>
                                                        <div className="text-slate-400">{s.dni}</div>
                                                    </td>
                                                    <td className="p-3">
                                                        <div>S/. {s.ingresos_mensuales}</div>
                                                        <div className="font-semibold text-indigo-600">S/. {s.monto_solicitado}</div>
                                                    </td>
                                                    <td className="p-3">
                                                        <span className={`px-2 py-1 rounded-full font-bold text-[10px] ${s.estado === 'Aprobado' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                            {s.estado}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 max-w-xs text-slate-500">
                                                        {s.dictamen_ia}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
